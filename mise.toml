# Local Android toolchain for `npm run tauri android dev|build`.
# Requires Android Studio / sdkmanager to have installed: platforms;android-36,
# build-tools, platform-tools, emulator and ndk;30.0.16248370 under ~/Android/Sdk.
[tools]
java = "17"

[env]
ANDROID_HOME = "{{env.HOME}}/Android/Sdk"
NDK_HOME = "{{env.HOME}}/Android/Sdk/ndk/30.0.16248370"
_.path = ["{{env.HOME}}/Android/Sdk/platform-tools", "{{env.HOME}}/Android/Sdk/emulator"]
